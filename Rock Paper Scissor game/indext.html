<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="heading">Rock Paper Scissors</h1>
    <div class="choices-cont">
        <div class="choices" id="rock" ></div>
        <div class="choices" id="paper"></div>     
       <div class="choices" id="scissor"></div>
    </div>
    <div class="scoreboard">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p >Comp</p>
        </div>
    </div>
    <div id="msg-cont">
        <p id="msg">Play Your Move</p>
    </div>
    
    <script src="script.js">y</script>
</body>
</html>
