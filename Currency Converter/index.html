<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="container">
        <h2 class="center">Currency Converter</h2>
        <form>
            <div class="amount">
            <p>Enter Amount</p>
            <input type="text" value="500">
            </div>
            <div class="select-area">
                <div id="from">
                <p>From</p>
                <div class="select-cont">
                      <img src="https://flagsapi.com/US/flat/64.png" alt="falg">
                    <select name="from">
                    </select>
                </div>
            </div>
             <i class="fa-solid fa-arrow-right-arrow-left"></i>
            <div id="to">
                <p>To</p>
                <div class="select-cont">
                    <img src="https://flagsapi.com/IN/flat/64.png" alt="falg">
                    <select name="to">
                    </select>
                </div>
            </div>
            </div>  
              <p class="msg"> 1USD=80 INR</p>  
            <button class="center">Get It Exchanged</button>
        </form>
    </div>
    <script src="country.js"></script>
    <script src="script.js"></script>
</body>

</html>
