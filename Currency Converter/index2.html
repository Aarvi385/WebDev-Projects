<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Currency converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <!doctype html>
    <html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>
        <div class="container-fluid vh-100">
            <div class="row min-vh-100 justify-content-center  align-items-center w-100">
                <div class="col-lg-5 col-10 main rounded-2 p-2">
                    <h5>Currency Converter</h5>
                    <form class="mt-4 form">
                        <div class="row align-items-center">
                            <div class="col-lg-12 amount">
                                <label for="exampleInputAmount" class="form-label">Enter Amount</label>
                                <input type="number" class="form-control form-control-lg" id="exampleInputAmount"
                                    aria-describedby="emailHelp">
                            </div>
                        </div>
                        <div class="row justify-content-center align-items-center text-center    ">
                            <div class="col-lg-4 col-8 mt-lg-0 mt-2">
                                <div>From</div>
                                <div class="select-cont d-flex align-items-center" id="from">
                                    <img src="https://flagsapi.com/US/flat/64.png" height="48" width="50" alt="falg"
                                        class="img-fluid rounded-start">
                                    <select class="select rounded-end " name="from" aria-label="Large select example">

                                    </select>
                                </div>

                            </div>
                            <div class="col-lg-2 col-7 fs-lg-2 pt-lg-4 pt-1">
                                <i class="bi bi-currency-exchange"></i>
                            </div>
                            <div class="col-lg-4 col-8">
                                <div>To</div>
                                <div class=" select-cont d-flex align-items-center " id="to">
                                    <img src="https://flagsapi.com/IN/flat/64.png" height="48" width="50" alt="falg"
                                        class="img-fluid rounded-start">
                                    <select class=" select rounded-end" name="to" aria-label="Large select example">

                                    </select>
                                </div>
                            </div>

                        </div>
                        <div class="row mt-lg-4 mt-3 ">
                            <div class="col-12">
                                <div class="msg">
                                    <textarea class="form-control text-white msg2 text-center"
                                        id="exampleFormControlTextarea1" >1USD=80INR</textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-lg-12 ">
                                <div class="d-grid gap-2 ">
                                    <button class=" btn btn-light btn-lg " type="button">Button</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </body>

    </html>

    <!--page end-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="country.js"></script>
    <script src="script.js"></script>
</body>

</html>
